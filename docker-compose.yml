name: ekb_connect

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ekb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ekb}
      POSTGRES_DB: ${POSTGRES_DB:-ekb_connect}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ekb} -d ${POSTGRES_DB:-ekb_connect}"]
      interval: 5s
      timeout: 3s
      retries: 10

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld /data/ural-fed-district-latest.osrm
    volumes:
      - ./backend/data:/data
    ports:
      - "5000:5000"
    # Требует предварительной подготовки: infra/osrm/prepare.sh
    profiles: ["osrm"]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ekb}:${POSTGRES_PASSWORD:-ekb}@postgres:5432/${POSTGRES_DB:-ekb_connect}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  mobile:
    build:
      context: ./mobile-app
      dockerfile: Dockerfile
    environment:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_BASE_URL: ${MOBILE_API_BASE_URL:-http://host.docker.internal:8080/api/v1}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${MOBILE_PACKAGER_HOSTNAME:-localhost}
    ports:
      - "8081:8081"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8081/status').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  pgdata: